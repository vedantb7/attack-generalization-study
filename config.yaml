# Single configuration for the controlled experiment.
# Every notebook and src/controlled_framework.py read their settings from here.
seed: 42                          # primary seed: its models/artifacts are the headline results
seeds: [42, 1, 2, 3, 4]           # every model is tuned + refit end to end once per seed (variance across seeds)
paths:
  train: dataset/raw/KDDTrain+.csv
  test: dataset/raw/KDDTest+.csv
  models: models                  # fitted model pipelines (*.joblib), primary seed
  scalars: scalars                # fitted preprocessor, feature names, label mapping
  metrics: results/metrics        # per-model metrics + statistical comparison (JSON); seeds/ for other seeds
  predictions: results/predictions  # per-row test predictions incl. P(attack) (CSV); seeds/ for other seeds
  tuning: results/tuning          # Optuna trial logs (JSON + CSV)
  tables: results/tables          # summary tables (CSV + Markdown)
  figures: results/figures        # plots, one sub-folder per notebook
  splits: results/splits          # novelty CV fold assignment
  eda: results/eda                # EDA summary (JSON)
cv:
  scheme: leave_attack_type_out   # each fold holds out a group of training attack TYPES plus a random share of normals
  n_splits: 5
tuning:
  n_trials: 25                    # identical Optuna TPE budget for every tuned model
  objective: novelty_roc_auc      # mean ROC-AUC of held-out attack types vs held-out normals
models:
  class_weight: null              # fixed identically for every model (removed from the search spaces)
evaluation:
  decision_threshold: 0.5         # fixed threshold for the primary test comparison
  fpr_budgets: [0.01, 0.02, 0.05] # operating points: thresholds from out-of-fold training normals, and ROC readings on test
  matched_fpr_for_tests: 0.02     # FPR budget used for the paired matched-FPR recall test
  bootstrap_iterations: 2000      # percentile bootstrap; >= 2000 so the p-value floor (2/(B+1)) survives Holm over 36 tests
  alpha: 0.05
  multiple_comparison: holm       # Holm-Bonferroni over the family of reported tests
